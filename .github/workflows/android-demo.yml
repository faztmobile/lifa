# Native end-to-end demo screenshots: the real app on an Android emulator (Pixel 7, API 34) with a demo-mode
# status bar, for both store builds. Manual only; it commits the images to docs/design/screens/native-android.
name: android-demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Render demo screens on the JVM (fails fast on a broken screen)
        run: ./gradlew :app:testGmsDebugUnitTest --tests 'za.co.lifa.DemoScreenTest' -Proborazzi.test.record=true
      - name: Build both store flavours
        run: ./gradlew :app:assembleGmsDebug :app:assembleHmsDebug
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: clients/android
          script: |
            bash scripts/capture-demo.sh app/build/outputs/apk/gms/debug/app-gms-debug.apk "$RUNNER_TEMP/demo/gms"
            bash scripts/capture-demo.sh app/build/outputs/apk/hms/debug/app-hms-debug.apk "$RUNNER_TEMP/demo/hms"
      - name: Publish screenshots to this branch
        working-directory: .
        run: |
          set -e
          n=$(ls "$RUNNER_TEMP"/demo/*/*.png 2>/dev/null | wc -l)
          if [ "$n" -lt 20 ]; then echo "Only $n screenshots captured; keeping the published set"; exit 1; fi
          D=docs/design/screens/native-android
          for f in gms hms; do mkdir -p "$D/$f" && rm -f "$D/$f"/*.png && cp "$RUNNER_TEMP/demo/$f"/*.png "$D/$f"/; done
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==12.3.0
          "$RUNNER_TEMP/venv/bin/python" -c "import glob,sys; from PIL import Image; [Image.open(f).reduce(2).save(f, optimize=True) for f in glob.glob(sys.argv[1] + '/*/*.png')]" "$D"
          ls -R "$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -m "CI: native Android demo screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-demo
          path: |
            ${{ runner.temp }}/demo
            clients/android/app/build/outputs/roborazzi
            clients/android/app/build/reports/tests
