name: ios
on:
  workflow_dispatch:
  pull_request:
    paths: ['clients/ios/**', 'design/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['clients/ios/**']
permissions:
  contents: read
defaults:
  run:
    working-directory: clients/ios
jobs:
  build-test:
    runs-on: macos-15
    permissions:
      contents: write # only used by the manual screenshot-publish step
    env:
      XCODEGEN_VERSION: '2.44.1' # [VERIFY] pinned XcodeGen release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install XcodeGen (pinned)
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
      - name: LifaDesign package tests
        run: xcodebuild test -scheme LifaDesign -destination 'platform=iOS Simulator,name=iPhone 16' -skipPackagePluginValidation
        working-directory: clients/ios/LifaDesign
      - name: Gallery XCUITests (accessibility audit, dark, AX-XXXL)
        run: xcodebuild test -project Lifa.xcodeproj -scheme Lifa -destination 'platform=iOS Simulator,name=iPhone 16' -resultBundlePath "$RUNNER_TEMP/ui.xcresult"
      - name: Export screenshots from the result bundle
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ios-screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/ios-raw" || true
          # Rename exported files to their human-readable names (gallery-light-00 …) using the manifest.
          python3 - "$RUNNER_TEMP/ios-raw" "$RUNNER_TEMP/ios-screens" <<'PY'
          import json, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          try:
              manifest = json.load(open(os.path.join(src, 'manifest.json')))
          except Exception as e:
              print('no manifest', e); sys.exit(0)
          for test in manifest:
              for a in test.get('attachments', []):
                  name = a.get('suggestedHumanReadableName', a['exportedFileName'])
                  base = name.split('_')[0] if name.startswith('gallery-') else name
                  if not base.endswith('.png'):
                      base = os.path.splitext(base)[0] + '.png'
                  shutil.copy(os.path.join(src, a['exportedFileName']), os.path.join(dst, base))
          PY
          ls "$RUNNER_TEMP/ios-screens" | head -50
      - name: Publish screenshots to this branch (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          set -e
          DEST=docs/design/screens/ios
          mkdir -p "$DEST" && rm -f "$DEST"/*.png
          cp "$RUNNER_TEMP"/ios-screens/gallery-*.png "$DEST"/ 2>/dev/null || true; for f in "$DEST"/*.png; do [ -f "$f" ] && sips -Z 1280 "$f" >/dev/null; done
          ls "$DEST" | head -40
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "CI: iOS gallery screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: ios-gallery-screens, path: '${{ runner.temp }}/ios-screens' }
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: ios-ui-results, path: '${{ runner.temp }}/ui.xcresult' }
