# Android (GMS + HMS flavours). First CI run is also the first compile: Google Maven is not reachable from the
# authoring environment (OPEN_QUESTIONS E, 02-monorepo).
name: android
on:
  workflow_dispatch:
  pull_request:
    paths: ['clients/android/**', 'design/**', 'api/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['clients/android/**']
permissions:
  contents: read
defaults:
  run:
    working-directory: clients/android
jobs:
  build-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used by the manual screenshot-publish step
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Gallery screenshots (Roborazzi, light / dark / 200% font)
        run: ./gradlew :core:design:testDebugUnitTest -Proborazzi.test.record=true --tests 'za.co.lifa.design.GalleryTest.screenshot*'
      - name: Publish screenshots to this branch (manual runs only)
        if: always() && github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          set -e
          DEST=docs/design/screens/android
          mkdir -p "$DEST" && rm -f "$DEST"/*.png
          cp clients/android/core/design/build/outputs/roborazzi/*.png "$DEST"/
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow==12.3.0
          "$RUNNER_TEMP/venv/bin/python" -c "import glob,sys; from PIL import Image; [Image.open(f).reduce(2).save(f, optimize=True) for f in glob.glob(sys.argv[1] + '/*.png')]" "$DEST"
          ls "$DEST" | head -40
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "CI: Android gallery screenshots for ${GITHUB_SHA::7} [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done
          exit 1
      - name: Unit and Compose UI tests (Robolectric)
        run: ./gradlew :core:design:testDebugUnitTest
      - name: Assemble both store flavours
        run: ./gradlew :app:assembleGmsDebug :app:assembleHmsDebug :app:lintGmsDebug
      - name: hms flavour has no Google services
        run: ./gradlew :app:checkHmsHasNoGms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-gallery
          path: |
            clients/android/core/design/build/outputs/roborazzi
            clients/android/core/design/build/reports/tests
            clients/android/app/build/outputs/apk
