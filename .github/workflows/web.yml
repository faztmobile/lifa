name: web
on:
  workflow_dispatch:
  pull_request:
    paths: ['clients/web/**', 'design/**', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['clients/web/**']
permissions:
  contents: read
defaults:
  run:
    working-directory: clients/web
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: clients/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright + axe (WCAG 2.2 AA, reflow, focus, touch targets)
        run: npm run e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-gallery-screens, path: clients/web/test-results }
