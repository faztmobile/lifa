# Shared components for the Lifa public API.
# Conventions: docs/architecture/04-api-contracts.md

schemas:
  Id:
    type: string
    format: uuid
    readOnly: true
  Timestamp:
    type: string
    format: date-time
  Date:
    type: string
    format: date
  Money:
    description: ZAR amount in cents. Lifa handles ZAR only (NFR-LOC-001).
    type: object
    required: [amountCents, currency]
    properties:
      amountCents: { type: integer, format: int64 }
      currency: { type: string, const: ZAR }
  ValueBasis:
    description: FRS principle 4 and FR-AST-004. Every figure is labelled.
    type: string
    enum: [declared, evidenced, estimated]
  RecordEvidence:
    description: FR-AST-004. A record is evidenced when linked to a supporting vault document.
    type: string
    enum: [declared, evidenced]
  LabelledMoney:
    type: object
    required: [value, basis]
    properties:
      value: { $ref: '#/schemas/Money' }
      basis: { $ref: '#/schemas/ValueBasis' }
      valueDate: { $ref: '#/schemas/Date' }
  Disclosure:
    description: FRS 12.2 mandatory disclosure. Clients render `text` verbatim.
    type: object
    required: [key, text]
    properties:
      key:
        type: string
        enum: [not-law-firm, estimate-only, education-only, executor-acts-alone, info-officer, activation-cancel]
      text: { type: string }
  Warning:
    description: >-
      Non-blocking warning attached to a write response. `possible_secret` implements FR-VLT-011:
      text or an upload looks like a password, PIN, private key or seed phrase.
    type: object
    required: [code, message]
    properties:
      code:
        type: string
        enum: [possible_secret, minor_direct_heir, witness_is_beneficiary, value_stale, nominee_asset, will_stale, massing_risk]
      message: { type: string }
      field: { type: string, description: JSON pointer into the request body }
  Page:
    type: object
    required: [items]
    properties:
      items: { type: array }
      nextCursor: { type: [string, 'null'] }
  Job:
    description: Asynchronous job (PDF generation, export, extraction).
    type: object
    required: [id, kind, status, createdAt]
    properties:
      id: { $ref: '#/schemas/Id' }
      kind: { type: string, enum: [signing-pack, emergency-card-pdf, estate-pack, account-export, extraction] }
      status: { type: string, enum: [queued, running, succeeded, failed] }
      createdAt: { $ref: '#/schemas/Timestamp' }
      completedAt: { $ref: '#/schemas/Timestamp' }
      resultDocumentId:
        description: Vault document holding the output, when the job produced a file.
        type: [string, 'null']
        format: uuid
      failureCode: { type: [string, 'null'] }
  Problem:
    description: RFC 9457 problem details, with Lifa extensions.
    type: object
    required: [type, title, status, code]
    properties:
      type: { type: string, format: uri }
      title: { type: string }
      status: { type: integer }
      detail: { type: string }
      instance: { type: string }
      code:
        type: string
        enum:
          - validation_failed
          - unauthenticated
          - step_up_required
          - device_not_bound
          - forbidden
          - not_found
          - conflict
          - precondition_failed
          - entitlement_limit
          - entitlement_missing
          - age_below_minimum
          - identity_not_verified
          - malware_detected
          - unsupported_media_type
          - payload_too_large
          - quota_exceeded
          - rate_limited
          - estate_frozen
          - dependency_unavailable
      stepUpScope:
        description: Present when code = step_up_required.
        $ref: '#/schemas/StepUpScope'
      entitlementKey:
        description: Present when code = entitlement_limit or entitlement_missing (FR-SUB-007 upgrade prompt).
        type: string
      limit: { type: integer }
      violations:
        type: array
        items:
          type: object
          required: [code, message]
          properties:
            field: { type: string }
            code: { type: string }
            message: { type: string }
  StepUpScope:
    description: FR-ONB-006, D-006.
    type: string
    enum: [vault.read, vault.write, release.write, grant.write, device.manage, account.export, account.delete, widget.enable]

parameters:
  Cursor:
    name: cursor
    in: query
    schema: { type: string }
  Limit:
    name: limit
    in: query
    schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  IfMatch:
    name: If-Match
    in: header
    required: true
    description: ETag from the last read. Optimistic concurrency for multi-device editing.
    schema: { type: string }
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    description: Client-generated UUID. Retries with the same key return the original result for 24 h.
    schema: { type: string, format: uuid }
  StepUpToken:
    name: Lifa-Step-Up
    in: header
    required: true
    description: Short-lived step-up token from POST /v1/step-up/verifications (D-022).
    schema: { type: string }

headers:
  ETag:
    schema: { type: string }

responses:
  BadRequest:
    description: Malformed request
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Unauthorized:
    description: Missing or invalid credentials, DPoP proof, or step-up token (code = step_up_required).
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Forbidden:
    description: Denied by policy (deny by default, FR-PRM-001) or entitlement (code = entitlement_limit or entitlement_missing).
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  NotFound:
    description: Not found, or not visible to the caller. Denied items return 404 to avoid confirming that they exist.
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Conflict:
    description: State conflict
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  PreconditionFailed:
    description: If-Match did not match the current ETag
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Unprocessable:
    description: Business validation failed
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  TooManyRequests:
    description: Rate limited
    headers:
      Retry-After:
        schema: { type: integer }
    content:
      application/problem+json:
        schema: { $ref: '#/schemas/Problem' }
  Accepted:
    description: Job accepted
    content:
      application/json:
        schema: { $ref: '#/schemas/Job' }
  NoContent:
    description: Done

securitySchemes:
  oidc:
    type: openIdConnect
    description: Entra External ID, authorization code + PKCE (D-009). Access tokens are DPoP-bound (cnf.jkt).
    openIdConnectUrl: https://login.lifa.co.za/.well-known/openid-configuration
  dpop:
    type: apiKey
    in: header
    name: DPoP
    description: RFC 9449 proof signed by the registered hardware-backed device key (D-022).
  widgetToken:
    type: http
    scheme: bearer
    description: Narrow, read-only, revocable token for the lock-screen emergency card (D-017).
