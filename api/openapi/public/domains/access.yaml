# Trusted people, role grants, release rules and the trusted-person view.
# Module: policy (lifa-protected, pool B). FR-PRM-*, FR-FAM-008, FR-NTF-006.
# Deny by default. Death and incapacity rules can be configured but stay inert until activation exists (R3, D-023).

paths:
  grants:
    get:
      operationId: listGrants
      tags: [Access]
      summary: Role grants the owner has made, with invitation status
      x-lifa-fr: [FR-FAM-008, FR-PRM-001]
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/schemas/RoleGrant' } }
    post:
      operationId: createGrant
      tags: [Access]
      summary: Give a person a role and send the invitation. Counts toward prm.max_role_holders; will nominations do not (D-016).
      x-lifa-fr: [FR-FAM-008, FR-PRM-001, FR-PRM-002, FR-NTF-006]
      x-lifa-step-up: grant.write
      x-lifa-entitlement: prm.max_role_holders
      parameters:
        - $ref: '../components/common.yaml#/parameters/StepUpToken'
        - $ref: '../components/common.yaml#/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/RoleGrantInput' }
      responses:
        '201':
          description: Grant created; invitation sent
          content:
            application/json:
              schema: { $ref: '#/schemas/RoleGrant' }
        '403': { $ref: '../components/common.yaml#/responses/Forbidden' }
        '422': { $ref: '../components/common.yaml#/responses/Unprocessable' }

  grant:
    parameters:
      - name: grantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateGrantScope
      tags: [Access]
      summary: Change the scope of a grant. Widening needs step-up; narrowing takes effect within 60 s.
      x-lifa-fr: [FR-PRM-001, FR-PRM-006]
      x-lifa-step-up: grant.write
      parameters:
        - $ref: '../components/common.yaml#/parameters/StepUpToken'
        - $ref: '../components/common.yaml#/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                scope: { $ref: '#/schemas/GrantScope' }
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/schemas/RoleGrant' }
    delete:
      operationId: revokeGrant
      tags: [Access]
      summary: Revoke immediately. Cached access is invalidated within 60 s, and later attempts are denied and logged (AT-PRM-01).
      description: Revocation reduces access, so it needs no step-up. It should never be harder to remove access than to grant it.
      x-lifa-fr: [FR-PRM-006]
      responses:
        '204': { $ref: '../components/common.yaml#/responses/NoContent' }
        '404': { $ref: '../components/common.yaml#/responses/NotFound' }

  grantResendInvitation:
    post:
      operationId: resendInvitation
      tags: [Access]
      summary: Resend the invitation with a new signed link (the old one is invalidated)
      x-lifa-fr: [FR-FAM-008, FR-NTF-006]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '202': { $ref: '../components/common.yaml#/responses/NoContent' }

  releaseRule:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: { $ref: '#/schemas/ReleaseTargetType' }
      - name: targetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setReleaseRule
      tags: [Access]
      summary: Attach or replace the release rule for a document, folder or emergency package (Plus)
      x-lifa-fr: [FR-PRM-003, FR-VLT-007, FR-EMG-003, FR-ONB-006]
      x-lifa-step-up: release.write
      x-lifa-entitlement: prm.release_rules
      parameters:
        - $ref: '../components/common.yaml#/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ReleaseRuleInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/schemas/ReleaseRule' }
        '403': { $ref: '../components/common.yaml#/responses/Forbidden' }
        '422': { $ref: '../components/common.yaml#/responses/Unprocessable' }
    delete:
      operationId: removeReleaseRule
      tags: [Access]
      summary: Remove the rule (the item returns to deny by default)
      x-lifa-fr: [FR-PRM-003]
      x-lifa-step-up: release.write
      parameters:
        - $ref: '../components/common.yaml#/parameters/StepUpToken'
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '204': { $ref: '../components/common.yaml#/responses/NoContent' }

  accessSummary:
    get:
      operationId: getAccessSummary
      tags: [Access]
      summary: '"Who sees what, and when": per person, what they see now and after death'
      x-lifa-fr: [FR-PRM-004]
      parameters:
        - name: personId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/schemas/AccessSummary' }

  sharedEstates:
    get:
      operationId: listSharedEstates
      tags: [Shared]
      summary: Estates where the caller holds a role (trusted-person view)
      x-lifa-fr: [FR-PRM-001]
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '200':
          description: Estates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [estateId, ownerGivenName, roles]
                      properties:
                        estateId: { type: string, format: uuid }
                        ownerGivenName: { type: string }
                        roles: { type: array, items: { $ref: '#/schemas/Role' } }

  sharedItems:
    get:
      operationId: listSharedItems
      tags: [Shared]
      summary: Items currently released to the caller. Each item is evaluated by policy for the current estate state.
      x-lifa-fr: [FR-PRM-001, FR-PRM-003]
      parameters:
        - name: estateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '401': { $ref: '../components/common.yaml#/responses/Unauthorized' }
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items, notice]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [itemType, itemId, label]
                      properties:
                        itemType: { type: string, enum: [document, folder, emergency_card, emergency_package] }
                        itemId: { type: string, format: uuid }
                        label: { type: string }
                  notice: { type: string, examples: ['You only see what Thandi chose to share with you.'] }

  sharedDocumentContent:
    get:
      operationId: getSharedDocumentContent
      tags: [Shared]
      summary: A trusted person reads a released document. Requires step-up; audited; the owner is notified (FR-PRM-005).
      x-lifa-fr: [FR-PRM-001, FR-PRM-005, FR-VLT-009]
      x-lifa-step-up: vault.read
      parameters:
        - name: estateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '../components/common.yaml#/parameters/StepUpToken'
      responses:
        '200':
          description: Document bytes (no-store)
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '404': { $ref: '../components/common.yaml#/responses/NotFound' }

schemas:
  Role:
    description: FRS 3.2 roles
    type: string
    enum: [spouse, executor, guardian, trustee, beneficiary, emergency_contact, verifier]
  GrantScope:
    description: Per item or per category; the owner can narrow it further (FRS 3.2)
    type: object
    properties:
      categories: { type: array, items: { type: string, enum: [emergency_card, will, documents_folder, emergency_package] } }
      itemRefs:
        type: array
        items:
          type: object
          required: [itemType, itemId]
          properties:
            itemType: { $ref: '#/schemas/ReleaseTargetType' }
            itemId: { type: string, format: uuid }
  RoleGrantInput:
    type: object
    required: [personId, role]
    properties:
      personId: { type: string, format: uuid }
      role: { $ref: '#/schemas/Role' }
      scope: { $ref: '#/schemas/GrantScope' }
      forPersonId: { type: [string, 'null'], format: uuid, description: For example "Guardian for Lerato" }
  RoleGrant:
    type: object
    required: [id, personId, personDisplayName, role, status]
    properties:
      id: { $ref: '../components/common.yaml#/schemas/Id' }
      personId: { type: string, format: uuid }
      personDisplayName: { type: string }
      role: { $ref: '#/schemas/Role' }
      forPersonId: { type: [string, 'null'], format: uuid }
      scope: { $ref: '#/schemas/GrantScope' }
      status: { type: string, enum: [invite_pending, invite_sent, accepted, declined, revoked, expired] }
      invitedAt: { $ref: '../components/common.yaml#/schemas/Timestamp' }
      acceptedAt: { $ref: '../components/common.yaml#/schemas/Timestamp' }
      countsTowardLimit: { type: boolean }
  ReleaseTargetType:
    type: string
    enum: [document, folder, emergency_package]
  ReleaseRuleType:
    description: FR-PRM-003. Death and incapacity types are inert until R3 activation (D-023).
    type: string
    enum: [immediately, on_confirmed_death, on_confirmed_death_with_executor_approval, on_confirmed_incapacity, on_date, on_beneficiary_age]
  ReleaseRuleInput:
    type: object
    required: [type, recipientPersonIds]
    properties:
      type: { $ref: '#/schemas/ReleaseRuleType' }
      recipientPersonIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
      releaseOn: { type: [string, 'null'], format: date, description: on_date only }
      age: { type: [integer, 'null'], minimum: 1, maximum: 120, description: on_beneficiary_age only }
  ReleaseRule:
    allOf:
      - $ref: '#/schemas/ReleaseRuleInput'
      - type: object
        required: [id, effectiveInCurrentRelease]
        properties:
          id: { $ref: '../components/common.yaml#/schemas/Id' }
          summary: { type: string, examples: ['On death, after executor approves'] }
          effectiveInCurrentRelease:
            description: False for death and incapacity rules until activation ships (D-023). The UI explains this.
            type: boolean
  AccessSummary:
    type: object
    required: [people]
    properties:
      people:
        type: array
        items:
          type: object
          required: [personId, displayName, now, afterDeath]
          properties:
            personId: { type: string, format: uuid }
            displayName: { type: string }
            now: { type: array, items: { type: string } }
            afterDeath: { type: array, items: { type: string } }
      recentAccess:
        type: array
        items:
          type: object
          required: [message, at]
          properties:
            message: { type: string, examples: ['Sipho opened your emergency card 3 days ago'] }
            at: { $ref: '../components/common.yaml#/schemas/Timestamp' }
